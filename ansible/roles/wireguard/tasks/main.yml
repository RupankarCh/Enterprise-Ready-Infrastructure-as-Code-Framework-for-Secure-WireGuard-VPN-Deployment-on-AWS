---
- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install WireGuard
  ansible.builtin.apt:
    name: "{{ wireguard_package }}"
    state: present

- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    reload: true

- name: Create WireGuard configuration directory
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Check whether server private key exists
  ansible.builtin.stat:
    path: /etc/wireguard/server_private.key
  register: wireguard_server_private_key

- name: Generate server private key
  ansible.builtin.shell:
    cmd: wg genkey > /etc/wireguard/server_private.key
    creates: /etc/wireguard/server_private.key
  when: not wireguard_server_private_key.stat.exists
  no_log: true

- name: Set server private key permissions
  ansible.builtin.file:
    path: /etc/wireguard/server_private.key
    owner: root
    group: root
    mode: "0600"

- name: Read server private key
  ansible.builtin.slurp:
    src: /etc/wireguard/server_private.key
  register: wireguard_server_private_key_content
  no_log: true

- name: Generate server public key
  ansible.builtin.shell:
    cmd: "wg pubkey < /etc/wireguard/server_private.key > /etc/wireguard/server_public.key"
    creates: /etc/wireguard/server_public.key
  no_log: true

- name: Set server public key permissions
  ansible.builtin.file:
    path: /etc/wireguard/server_public.key
    owner: root
    group: root
    mode: "0644"

- name: Deploy WireGuard server configuration
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: "0600"

- name: Enable and start WireGuard
  ansible.builtin.systemd:
    name: "wg-quick@{{ wireguard_interface }}"
    enabled: true
    state: started
