---

- name: Validate WireGuard client configuration
  ansible.builtin.import_tasks: validate_clients.yml

- name: Validate discovered external network interface
  ansible.builtin.assert:
    that:
      - ansible_default_ipv4 is defined
      - ansible_default_ipv4.interface is defined
      - ansible_default_ipv4.interface | length > 0
    fail_msg: >-
      Could not discover the server's default IPv4 network interface.
      Check network connectivity and Ansible fact gathering.
    quiet: true

- name: Validate CloudVPN firewall lifecycle configuration
  ansible.builtin.assert:
    that:
      - >-
        not (wireguard_firewall_enabled | bool) or
        (wireguard_firewall_persist | bool)
      - >-
        (wireguard_firewall_enabled | bool) or
        (wireguard_allow_unprotected_wireguard | bool)
    fail_msg: >-
      Unsafe firewall configuration. An enabled firewall must be persistent.
      Disabling the firewall requires explicit opt-in with
      wireguard_allow_unprotected_wireguard=true.
    quiet: true

- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install WireGuard
  ansible.builtin.apt:
    name: "{{ wireguard_package }}"
    state: present

- name: Validate external network interface exists
  ansible.builtin.command:
    argv:
      - ip
      - link
      - show
      - dev
      - "{{ wireguard_external_interface }}"
  changed_when: false

- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    reload: true

- name: Create WireGuard configuration directory
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Manage WireGuard server keys
  ansible.builtin.import_tasks: keys.yml

- name: Deploy WireGuard server configuration
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: "0600"
  notify: Restart WireGuard

- name: Configure firewall persistence
  ansible.builtin.import_tasks: firewall_persistence.yml
  when:
    - wireguard_firewall_enabled | bool
    - wireguard_firewall_persist | bool

- name: Remove managed firewall integration when explicitly disabled
  ansible.builtin.import_tasks: firewall_disabled.yml
  when: not (wireguard_firewall_enabled | bool)

- name: Apply pending WireGuard and firewall restarts
  ansible.builtin.meta: flush_handlers

- name: Enable and start WireGuard
  ansible.builtin.systemd:
    name: "wg-quick@{{ wireguard_interface }}"
    enabled: true
    state: started
