name: CloudVPN CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Check Terraform formatting
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without backend
        working-directory: terraform
        run: terraform init -backend=false -lockfile=readonly

      - name: Validate Terraform
        working-directory: terraform
        run: terraform validate

  ansible:
    name: Ansible syntax validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install Ansible dependencies
        run: python -m pip install -r ansible/requirements.lock.txt

      - name: Prepare example deployment configuration
        run: |
          cp config/deployment.example.json config/deployment.json

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("config/deployment.json")
          config = json.loads(path.read_text())
          config["ssm"]["bucket_name"] = "cloudvpn-ci-test-bucket-123456"
          path.write_text(json.dumps(config, indent=2) + "\n")
          PY

      - name: Generate Terraform and Ansible variables
        run: ./scripts/configure.sh

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Check playbook syntax
        working-directory: ansible
        run: >
          ansible-playbook
          -i inventory/hosts.example.yml
          playbooks/wireguard.yml
          --syntax-check
          -e wireguard_client_vars_file=vars/client1.example.yml

  firewall-tests:
    name: Firewall tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Check shell syntax
        run: bash -n ansible/roles/wireguard/files/cloudvpn-firewall.sh

      - name: Run firewall tests
        run: |
          python -m unittest discover \
            -s tests/firewall \
            -p 'test_*.py' \
            -v

  gitleaks:
    name: Secret scanning
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
  trivy:
    name: Terraform security scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Scan Terraform configuration with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: terraform
          version: v0.76.2
          severity: HIGH,CRITICAL
          format: table
          output: trivy-report.txt
          exit-code: "0"
          hide-progress: true

      - name: Publish Trivy report to workflow summary
        if: always()
        run: |
          if [ -s trivy-report.txt ]; then
            {
              echo "## Terraform Security Scan"
              echo "<details><summary>View Trivy findings</summary>"
              echo ""
              echo '```text'
              cat trivy-report.txt
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Trivy report was generated." >> "$GITHUB_STEP_SUMMARY"
          fi
